<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>

        <!-- 1. Botão do menu estilo hambúrguer -->
        <button class="menu">&#9776;</button>

        <nav class="header-links">

        <div class="coluna">

                <p class="texto-card">Texto do card</p>
                <button class="bnt-card">Clique aqui!</button>

                <li>Item 1</li>

                <li>Item 3</li>
            </ul>
        </div>
        <!-- Lado Direito: Texto e Subtítulo -->
        <div>  
            <div class="texto-direito">
                <p>Este é o texto principal que fica na parte superior direita do seu layout.</p>
                <h4>Subtítulo da Direita</h4>
                <a href="#" class="link">*LINK</a>

    <footer>
